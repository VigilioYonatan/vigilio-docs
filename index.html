<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Vigilio Docs - Portal de Arquitectura</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentación de Arquitectura Centralizada Vigilio">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Theme: Dark Themeable Premium -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  
  <!-- Custom Aesthetics -->
  <style>
    :root {
      --theme-color: #38bdf8;
      --base-font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --base-font-size: 16px;
      --sidebar-width: 330px;
      --sidebar-name-color: #38bdf8;
      --sidebar-name-font-weight: 700;
      --content-max-width: 980px;
      --code-font-family: "Fira Code", "Cascadia Code", monospace;
    }
    
    /* Sleek scrollbars */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #38bdf8; }
    
    .sidebar { background-color: #0b1329 !important; border-right: 1px solid #1e293b; }
    .sidebar-nav li > a { font-size: 0.95rem; }
    .markdown-section code { background: #1e293b !important; color: #f1f5f9 !important; border-radius: 6px; padding: 0.2rem 0.4rem; }
    .markdown-section pre { background: #0f172a !important; border: 1px solid #1e293b; border-radius: 8px; }
    .docsify-copy-code-button { background: #1e293b !important; color: #38bdf8 !important; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="app">⚡ Cargando portal de documentación...</div>
  <script>
    window.$docsify = {
      name: '📚 Vigilio Docs',
      repo: 'https://github.com/VigilioYonatan/vigilio-docs',
      loadSidebar: true,
      sidebarDisplayLevel: 1,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      copyCode: {
        buttonText: 'Copiar',
        errorText: 'Error',
        successText: '¡Copiado!'
      },
      pagination: {
        previousText: '← Anterior',
        nextText: 'Siguiente →',
        crossChapter: true,
        crossChapterText: true
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 Buscar en la documentación...',
        noData: 'No se encontraron resultados',
        depth: 6
      }
    }
  </script>
  <!-- Docsify v4 Core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  
  <!-- Plugins: Acordeón Lateral, Copiado de Código y Paginador -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>

  <!-- Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
</body>
</html>
