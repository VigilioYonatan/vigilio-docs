<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Vigilio Docs - Portal de Arquitectura</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentación de Arquitectura Centralizada Vigilio">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- CSS Theme & Sidebar Collapse plugin styles -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar-folder.min.css" />
  
  <!-- Custom Aesthetics -->
  <style>
    :root {
      --theme-color: #38bdf8;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a !important;
      color: #e2e8f0 !important;
    }
    .sidebar {
      background-color: #0b1329 !important;
      border-right: 1px solid #1e293b !important;
      padding-top: 1rem;
    }
    .sidebar-nav > ul > li {
      margin-top: 0.8rem;
    }
    .sidebar-nav strong {
      color: #38bdf8 !important;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .sidebar-nav ul li a {
      color: #94a3b8 !important;
      font-size: 0.92rem;
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
      transition: all 0.2s ease;
    }
    .sidebar-nav ul li a:hover {
      color: #38bdf8 !important;
      background-color: #1e293b;
    }
    .sidebar-nav ul li.active > a {
      color: #38bdf8 !important;
      font-weight: bold;
      background-color: #1e293b;
      border-left: 3px solid #38bdf8;
    }
    .markdown-section h1, .markdown-section h2, .markdown-section h3 {
      color: #f8fafc;
      border-bottom-color: #1e293b;
    }
    .markdown-section code {
      background: #1e293b !important;
      color: #38bdf8 !important;
      border-radius: 6px;
      padding: 0.2rem 0.4rem;
    }
    .markdown-section pre {
      background: #090d16 !important;
      border: 1px solid #1e293b;
      border-radius: 8px;
    }
    .docsify-copy-code-button {
      background: #1e293b !important;
      color: #38bdf8 !important;
      border-radius: 4px;
    }
    /* Smooth Accordion transition */
    .sidebar-nav li.collapse > ul {
      transition: max-height 0.3s cubic-bezier(0, 1, 0, 1);
    }
  </style>
</head>
<body>
  <div id="app">⚡ Cargando portal de documentación...</div>
  <script>
    window.$docsify = {
      name: '📚 Vigilio Docs',
      repo: 'https://github.com/VigilioYonatan/vigilio-docs',
      loadSidebar: true,
      subMaxLevel: 2,
      sidebarDisplayLevel: 1,
      auto2top: true,
      homepage: 'README.md',
      copyCode: {
        buttonText: 'Copiar',
        errorText: 'Error',
        successText: '¡Copiado!'
      },
      pagination: {
        previousText: '← Anterior',
        nextText: 'Siguiente →',
        crossChapter: true,
        crossChapterText: true
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 Buscar en la documentación...',
        noData: 'No se encontraron resultados',
        depth: 6
      }
    }
  </script>
  <!-- Docsify Core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  
  <!-- Plugins: Acordeón Folder Style, Buscador, Copiar y Paginador -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>

  <!-- Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
</body>
</html>
